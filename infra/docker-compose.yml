services:
  postgres:
    image: postgres:16-alpine
    container_name: clone-fanos-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clone_fanos
    volumes:
      - clone_fanos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d clone_fanos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clone_fanos_postgres_data:
